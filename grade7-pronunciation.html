<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 7 Pronunciation Trainer</title><style>body{margin:0;background:#edf4ff;font-family:system-ui,sans-serif;color:#172b4d}main{max-width:760px;margin:30px auto;background:white;padding:28px;border-radius:22px;box-shadow:0 8px 28px #17376518}h1{color:#1757ad;font-size:clamp(24px,4vw,34px)}select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #c5d6ed}select{width:100%;margin:12px 0}button{background:#185abc;color:white;border:0;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.5}#sentence{font-size:clamp(23px,4vw,34px);font-weight:700;line-height:1.5;background:#eaf2ff;padding:24px;border-radius:14px;margin:18px 0}#feedback{min-height:70px;line-height:1.8}.good{color:#087947}.bad{color:#c12e36}.muted{color:#5a687a;font-size:13px}#score{font-weight:bold} .progress{height:9px;background:#e2eaf5;border-radius:20px;overflow:hidden}.bar{height:100%;background:#3277dc;transition:width .2s} .recognized{padding:12px;background:#f6f8fc;border-radius:8px;white-space:pre-wrap} </style></head><body><main><h1>🎤 Grade 7 Pronunciation Trainer</h1><p>現在進行形・オンラインツアーの英文を1文ずつ練習しよう！</p><label for="topic">教材を選ぶ</label><select id="topic"></select><p id="count"></p><div class="progress"><div class="bar" id="bar"></div></div><div id="sentence"></div><button id="listen">🔊 お手本を聞く</button><button id="speak">🎤 発音する</button><button id="retry">🔁 もう一度</button><button id="next">次の問題 →</button><div id="feedback" aria-live="polite">マイクボタンを押して発音してね。</div><p id="score"></p><p class="muted">Chrome推奨。マイクの使用を許可してください。判定は音声認識で得た単語との一致度を使った練習用の目安で、音声学的な発音精度を測るものではありません。ブラウザの音声認識サービスに音声が送信される場合があります。学習結果はサーバーに保存されません。</p></main><script>
// 教科書の題材に沿った練習用オリジナル英文（教科書本文の転載ではありません）
const lessons={
'Part 1｜電話での会話':['Hello, Anna. Can you talk now?','Yes, I can talk.','I am watching TV now.','What are you doing?','I am thinking about tomorrow.','Do you have any plans?','I am free tomorrow.'],
'Part 1｜明日の予定':['Are you busy tomorrow?','Let us visit a new place.','That sounds great.','What time can we meet?','We can meet at three.','I am looking forward to it.'],
'Part 2｜ロンドンのオンラインツアー':['Welcome to our online tour.','We are visiting London today.','I am standing in a busy market.','You can see many shops here.','What are those people doing?','They are taking pictures.','We are learning about the city.'],
'Part 2｜湖水地方':['I am in the Lake District.','This lake is very beautiful.','Are you walking around the lake?','Yes, I am.','I am reading a book by the lake.','Many people are enjoying nature.'],
'会話｜家族との電話':['What are you doing now?','I am talking with my friends.','Are you traveling in London?','No, I am taking an online tour.','We are looking at a famous palace.','Our guide is taking pictures.','That sounds exciting.','Please do not be late.']};
const topic=document.querySelector('#topic'),sentence=document.querySelector('#sentence'),count=document.querySelector('#count'),bar=document.querySelector('#bar'),feedback=document.querySelector('#feedback'),score=document.querySelector('#score');let idx=0,attempts=0,best=0,recognition=null;
Object.keys(lessons).forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;topic.appendChild(o)});
function normalize(s){return s.toLowerCase().replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim().replace(/\b(im)\b/g,'i am').replace(/\b(youre)\b/g,'you are').replace(/\b(theyre)\b/g,'they are').replace(/\b(were)\b/g,'we are').replace(/\b(let us)\b/g,'lets')}
function words(s){return normalize(s).split(' ').filter(Boolean)}
function render(){let arr=lessons[topic.value];sentence.textContent=arr[idx];count.textContent=`${idx+1} / ${arr.length}`;bar.style.width=((idx+1)/arr.length*100)+'%';feedback.textContent='マイクボタンを押して発音してね。';score.textContent='';document.querySelector('#next').textContent=idx===arr.length-1?'最初に戻る ↺':'次の問題 →'}
topic.onchange=()=>{idx=0;render()};document.querySelector('#next').onclick=()=>{idx=(idx+1)%lessons[topic.value].length;render()};document.querySelector('#listen').onclick=()=>{if(!('speechSynthesis'in window)){feedback.textContent='このブラウザは音声読み上げに対応していません。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(sentence.textContent);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};
function start(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){feedback.textContent='このブラウザでは音声認識が利用できません。ChromeでHTTPSの公開URLから開いてください。';return}if(recognition){try{recognition.abort()}catch(e){}}recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=1;const target=sentence.textContent;feedback.textContent='🎙️ 聞き取り中… 英文を読んでください。';document.querySelector('#speak').disabled=true;recognition.onresult=e=>{let heard=e.results[0][0].transcript;let a=words(target),b=words(heard);let dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);let pct=Math.round(100*dp[a.length][b.length]/Math.max(a.length,b.length,1));attempts++;best=Math.max(best,pct);feedback.innerHTML='';let p=document.createElement('p');p.className='recognized';p.textContent='認識された英文：'+heard;feedback.appendChild(p);let q=document.createElement('p');q.className=pct>=80?'good':'bad';q.textContent=pct>=80?'よくできました！':'お手本を聞いて、もう一度挑戦しよう！';feedback.appendChild(q);score.textContent=`単語一致度：${pct}点 / 100点（この問題の練習回数：${attempts}回）`};recognition.onerror=e=>{feedback.textContent='音声認識エラー：'+e.error+'。マイクの許可とインターネット接続を確認してください。'};recognition.onend=()=>{document.querySelector('#speak').disabled=false};try{recognition.start()}catch(e){feedback.textContent='マイクを起動できませんでした。';document.querySelector('#speak').disabled=false}}
document.querySelector('#speak').onclick=start;document.querySelector('#retry').onclick=start;render();
</script></body></html>
