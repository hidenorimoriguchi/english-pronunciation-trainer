<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Pronunciation Trainer</title><style>body{font-family:system-ui,sans-serif;background:#f0f5ff;color:#17243c;margin:0;padding:24px}main{max-width:720px;margin:auto;background:white;border-radius:20px;padding:28px;box-shadow:0 8px 30px #1d37621a}h1{color:#2257ae}button,select{font:inherit;padding:12px 16px;border-radius:10px;border:1px solid #9eb4d9}button{background:#2257ae;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.prompt{font-size:1.6rem;font-weight:700;padding:22px;background:#eaf1ff;border-radius:12px}#result{white-space:pre-wrap;line-height:1.7;margin-top:18px}small{color:#58647a}</style></head><body><main><h1>🎤 English Pronunciation Trainer</h1><p>英文を読んで、マイクで練習しよう！</p><label for="level">レベル：</label><select id="level"><option value="easy">Level 1</option><option value="middle">Level 2</option><option value="advanced">Level 3</option></select><p id="counter"></p><div class="prompt" id="prompt"></div><p><button id="listen">🔊 お手本を聞く</button> <button id="record">🎤 発音する</button> <button id="next">次の問題 →</button></p><div id="result" role="status" aria-live="polite">マイクボタンを押して発音してね。</div><p><small>Chrome推奨。マイクの使用を許可してください。判定は音声認識で得た単語との一致度を使った練習用の目安で、発音の音響的な正確さを採点するものではありません。音声認識機能ではブラウザのサービスに音声が送信される場合があります。</small></p></main><script>
const questions={easy:['I like apples.','This is my book.','I can swim.','What is your name?','I play soccer.'],middle:['I went to the park yesterday.','She is reading a book now.','Which season do you like best?','I want to visit New York.','We have studied English for two years.'],advanced:['If I had more time, I would travel around the world.','The book written by my friend is interesting.','This is the place where I grew up.','Learning another language helps us understand different cultures.','I have never seen such a beautiful sunset.']};let index=0;const level=document.querySelector('#level'),promptEl=document.querySelector('#prompt'),result=document.querySelector('#result'),record=document.querySelector('#record');function show(){let list=questions[level.value];index%=list.length;promptEl.textContent=list[index];document.querySelector('#counter').textContent=`${index+1} / ${list.length}`;result.textContent='マイクボタンを押して発音してね。'}level.onchange=()=>{index=0;show()};document.querySelector('#next').onclick=()=>{index++;show()};document.querySelector('#listen').onclick=()=>{if(!('speechSynthesis'in window)){result.textContent='読み上げ機能が使えません。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(promptEl.textContent);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){record.disabled=true;result.textContent='このブラウザは音声認識に対応していません。Chromeで開いてください。'}else{let recognition=new Recognition();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{let heard=e.results[0][0].transcript;let normalize=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,'').trim().replace(/\s+/g,' ');let expected=normalize(promptEl.textContent).split(' '),actual=normalize(heard).split(' ');let dp=Array.from({length:expected.length+1},()=>Array(actual.length+1).fill(0));for(let i=1;i<=expected.length;i++)for(let j=1;j<=actual.length;j++)dp[i][j]=expected[i-1]===actual[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);let score=Math.round(100*2*dp[expected.length][actual.length]/Math.max(1,expected.length+actual.length));result.textContent=`聞き取った英文：${heard}\n一致度：${score}%\n${score>=90?'Great job! 🌟':score>=65?'Good try! もう一度挑戦しよう。':'お手本を聞いてもう一度練習しよう！'}`};recognition.onerror=e=>{result.textContent='音声認識エラー：'+e.error+'。マイクの許可とインターネット接続を確認してください。'};recognition.onend=()=>{record.disabled=false;record.textContent='🎤 発音する'};record.onclick=()=>{try{recognition.start();record.disabled=true;record.textContent='聞き取り中…';result.textContent='英語を話してください…'}catch(e){result.textContent='開始できませんでした。もう一度試してください。'}}}show();
</script></body></html>
