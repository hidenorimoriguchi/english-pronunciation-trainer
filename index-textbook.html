<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Pronunciation Trainer</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f0f5ff;color:#17243c;margin:0;padding:20px}main{max-width:760px;margin:auto;background:white;border-radius:20px;padding:28px;box-shadow:0 8px 30px #1d37621a}h1{color:#2257ae;font-size:clamp(1.4rem,4vw,2rem)}button,select{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid #9eb4d9}select{max-width:100%;width:100%;background:white}label{display:block;font-weight:650;margin:12px 0 5px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{background:#2257ae;color:white;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.5;cursor:not-allowed}.prompt{font-size:clamp(1.3rem,3.5vw,1.8rem);font-weight:700;padding:22px;background:#eaf1ff;border-radius:12px;line-height:1.55}#result{white-space:pre-wrap;line-height:1.7;margin-top:18px}small{color:#58647a}#counter{font-weight:650}@media(max-width:520px){main{padding:18px}.controls{grid-template-columns:1fr}button{width:100%}}
</style></head><body><main><h1>🎤 English Pronunciation Trainer</h1><p>世界遺産について、英文を1文ずつ発音しよう！</p><div class="controls"><div><label for="topic">教材・題材</label><select id="topic"><option value="heritage">World Heritage（世界遺産）</option><option value="cape">Cape Floral Region（南アフリカ）</option><option value="taj">Taj Mahal（インド）</option><option value="fuji">Mt. Fuji（日本）</option><option value="original">以前の練習問題</option></select></div><div id="levelBox" hidden><label for="level">レベル</label><select id="level"><option value="easy">Level 1</option><option value="middle">Level 2</option><option value="advanced">Level 3</option></select></div></div><p id="counter"></p><div class="prompt" id="prompt"></div><p><button id="listen">🔊 お手本を聞く</button><button id="record">🎤 発音する</button><button id="next">次の問題 →</button></p><div id="result" role="status" aria-live="polite">マイクボタンを押して発音してね。</div><p><small>※教材のテーマに基づくオリジナル練習文です。教科書本文の転載ではありません。Chrome推奨。マイクの使用を許可してください。一致度は音声認識された単語との比較であり、発音の音響的な正確さを採点するものではありません。ブラウザの音声認識サービスに音声が送信される場合があります。</small></p></main><script>
const questions={heritage:['There are many beautiful places around the world.','Some special places are World Heritage sites.','World Heritage sites can be natural or cultural.','Some sites have both natural and cultural value.','People around the world work to protect these places.','UNESCO helps people learn about World Heritage.'],cape:['The Cape Floral Region is in South Africa.','It is famous for its many kinds of plants.','Thousands of plant species grow in this region.','Some plants are found only in this area.','Rooibos is a plant from South Africa.','We should protect the diversity of plants.'],taj:['The Taj Mahal is a famous World Heritage site in India.','It was built many years ago.','Many people visit the Taj Mahal every year.','The building is known for its beautiful white marble.','Air pollution can damage old buildings.','People are working to protect the Taj Mahal.'],fuji:['Mount Fuji is a famous mountain in Japan.','It is a cultural World Heritage site.','Many people enjoy looking at Mount Fuji.','Some visitors climb the mountain in summer.','Litter is a serious problem on mountain trails.','We can help keep Mount Fuji clean.'],original:{easy:['I like apples.','This is my book.','I can swim.','What is your name?','I play soccer.'],middle:['I went to the park yesterday.','She is reading a book now.','Which season do you like best?','I want to visit New York.','We have studied English for two years.'],advanced:['If I had more time, I would travel around the world.','The book written by my friend is interesting.','This is the place where I grew up.','Learning another language helps us understand different cultures.','I have never seen such a beautiful sunset.']}};
let index=0;const topic=document.querySelector('#topic'),level=document.querySelector('#level'),promptEl=document.querySelector('#prompt'),result=document.querySelector('#result'),record=document.querySelector('#record');const getList=()=>topic.value==='original'?questions.original[level.value]:questions[topic.value];function show(){const list=getList();index=((index%list.length)+list.length)%list.length;promptEl.textContent=list[index];document.querySelector('#counter').textContent=`${index+1} / ${list.length}`;result.textContent='マイクボタンを押して発音してね。'}topic.onchange=()=>{index=0;document.querySelector('#levelBox').hidden=topic.value!=='original';show()};level.onchange=()=>{index=0;show()};document.querySelector('#next').onclick=()=>{index++;show()};document.querySelector('#listen').onclick=()=>{if(!('speechSynthesis'in window)){result.textContent='読み上げ機能が使えません。';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(promptEl.textContent);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){record.disabled=true;result.textContent='このブラウザは音声認識に対応していません。Chromeで開いてください。'}else{const recognition=new Recognition();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{const heard=e.results[0][0].transcript;const normalize=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,'').trim().replace(/\s+/g,' ');const expected=normalize(promptEl.textContent).split(' '),actual=normalize(heard).split(' ');const dp=Array.from({length:expected.length+1},()=>Array(actual.length+1).fill(0));for(let i=1;i<=expected.length;i++)for(let j=1;j<=actual.length;j++)dp[i][j]=expected[i-1]===actual[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);const score=Math.round(100*2*dp[expected.length][actual.length]/Math.max(1,expected.length+actual.length));result.textContent=`聞き取った英文：${heard}\n一致度：${score}%\n${score>=90?'Great job! 🌟':score>=65?'Good try! もう一度挑戦しよう。':'お手本を聞いてもう一度練習しよう！'}`};recognition.onerror=e=>{result.textContent='音声認識エラー：'+e.error+'。マイクの許可とインターネット接続を確認してください。'};recognition.onend=()=>{record.disabled=false;record.textContent='🎤 発音する'};record.onclick=()=>{try{recognition.start();record.disabled=true;record.textContent='聞き取り中…';result.textContent='英語を話してください…'}catch(e){result.textContent='開始できませんでした。もう一度試してください。'}}}show();
</script></body></html>
